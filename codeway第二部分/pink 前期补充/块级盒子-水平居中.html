<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        [class^="box"] {
      width: 150px;
      height: 150px;
      background-color: pink;
    }
    .box2 {
      background-color: skyblue;
      margin-left: auto;
    }

    .box1{
        /* margin: 0 auto; b站 */
        margin: auto; /* 京东 */
        /* 小米写法  */
        margin-left: auto;
        margin-right: auto;
    }
    p{
        text-align: center;
    }
    .box3{
        margin-right: auto;
    } 
    </style>
</head>
<body>
  <div class="box1"></div>
  <div class="box2"></div>
  <div class="box3"></div>
  <!-- 行内盒子给他套个块级盒子 -->
  <p><span>123</span></p>
</body>
</html>
