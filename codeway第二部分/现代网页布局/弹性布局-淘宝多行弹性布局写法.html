<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
         * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    .w {
      width: 80%;
      margin: 20px auto;
    }

    .box {
      display: flex;
      flex-wrap: wrap;
      border: 1px solid red;
      margin-left: -8px;
      margin-right: -8px;
    }
    /* 不矛盾，border-box会重新计算盒子大小的，里边的box盒子实际上是比w父盒子变宽了16px */

    .box .item {
      /* width: 80px; */
      /* 如果写了  flex-wrap: wrap;然后写 flex: 1;  这样的话就不能换行了，只能在一行内显示 */
      /* flex: 1; */
      /* 如果写了  flex-wrap: wrap;然后写 flex: 0 0 16.666666%;  这样的话就可以换行了，整行的宽度是 100%，
      如果我一行显示6个，那么每个宽度就是100% / 6 = 16.666666%   其实也能缩放 */
      flex: 0 0 16.666666%;
      height: 120px;
      /* background-color: pink; */
      margin-bottom: 16px;
      /* margin-right: 16px; */
      padding: 0 8px;
    }
    .item .content {
      height: 100%;
      width: 100%;
      background-color: pink;
    }

    .footer {
      width: 80%;
      height: 120px;
      background-color: black;
      margin: 0 auto;
    }
    </style>
</head>
<body>
  <div class="w">
    <div class="box">
      <div class="item">
        <div class="content"></div>
      </div>
      <div class="item">
        <div class="content"></div>
      </div>
      <div class="item">
        <div class="content"></div>
      </div>
      <div class="item">
        <div class="content"></div>
      </div>
      <div class="item">
        <div class="content"></div>
      </div>
      <div class="item">
        <div class="content"></div>
      </div>
      <div class="item">
        <div class="content"></div>
      </div>
      <div class="item">
        <div class="content"></div>
      </div>
      <div class="item">
        <div class="content"></div>
      </div>
      <div class="item">
        <div class="content"></div>
      </div>
      <div class="item">
        <div class="content"></div>
      </div>
      <div class="item">
        <div class="content"></div>
      </div>
      <div class="item">
        <div class="content"></div>
      </div>
      <div class="item">
        <div class="content"></div>
      </div>
      <div class="item">
        <div class="content"></div>
      </div>
      <div class="item">
        <div class="content"></div>
      </div>

    </div>
  </div>

  <div class="footer"></div>  
</body>
</html>
