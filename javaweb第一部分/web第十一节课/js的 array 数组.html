<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //数组的定义-1
        // var arr = new Array(1,2,3,4)
        // 数组的定义-2
        // var arr = [1,2,3,4]
        // console.log(arr[0]) 
        // console.log(arr[1])

        //特点：长度可变，
        // var arr = [1,2,3,4]
        // arr[10] = 50;
        // console.log(arr[10])
        // console.log(arr[9])
        // console.log(arr[8])

        //类型可变
        // arr[9] = "A"
        // arr[8] = "true"
        // console.log(arr)


        var arr = [1,2,3,4]
        arr[10] = 50;
        for (let i = 0; i < arr.length; i++) {
            console.log(arr[i]);
        }

        console.log("=============================================================================================================================================");
        

        //foreach. 遍历数组中优质的元素
        arr.forEach(function(e) {
            console.log(e);
        });
        //for和 foreach 的区别，for 是遍历数字的所有数据，而 foreach 则是遍历数组中有值的数据


        //es6箭头函数
        arr.forEach((e) => {
            console.log(e);
            
        })

        //push添加元素到数组的末尾
        arr.push(7,8,9)
        console.log(arr);
        
        //splice:删除元素
        arr.splice(2,2)
        console.log(arr);
        // splice第一个参数是删除的起始位置，第二个参数是删除的个数
        



    </script>
    
</body>
</html>
