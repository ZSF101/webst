<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            width: 249px;
            height: 100px;
            /* background: pink; */
            /* background: linear-gradient(to right,pink,skyblue); */
            /* background: linear-gradient(to top, red, blue); */
            /* deg是角度，0deg表示从上到下，90deg表示从左到右 */
            /* background: linear-gradient(90deg, pink, skyblue); */
            /* 位置 是色标的位置 */
            /* background: linear-gradient(90deg,pink 20%,skyblue); */
            /* background: linear-gradient(90deg,pink 20%,skyblue 80%); */
            /* background: linear-gradient(90deg,pink 50%,skyblue 50%); */
            /* background: linear-gradient(180deg,#3ecec5D8 0%, #26bcc6 100%); */
            background-image: linear-gradient(180deg,#3ecec5D8 0%, #26bcc6 100%);

        }
        .text{
            font-size: 30px;
            font-weight: 700;
            /* 渐变背景文字 */
            background-image: linear-gradient(97deg, #0096FF, #BB64FF 42%, #F2416B 74%, #EB7500);
            /* -webkit- 前缀  谷歌浏览器老版本的兼容性写法 */
            -webkit-background-clip: text;
            /* 背景裁剪 以文字的形式裁剪 */
            background-clip: text;
            /* 文本填充颜色 为透明 */
            -webkit-text-fill-color: transparent; 
        }
    </style>
</head>
<body>
  <div class="box"></div>
  <div class="text">我是渐变的文字，你喜欢吗？</div>
  <button class="gradient-btn">搜索</button>
</body>
</html>
