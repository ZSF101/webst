<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* 选择第一个 li */
        .ul1 li:first-child{
            color: red;
        }
        /* 选择最后一个li */
        .ul1 li:last-child{
            color: skyblue;
        }
        /* 选择第三个 li */
        .ul1 li:nth-child(3){
            color: yellow;
        }
        /* 选择第八个 li */
        .ul1 li:nth-child(8){
            color: green;
        } 
        /* 选择奇数个 */
        .ul2 li:nth-child(odd){
            color: pink;
        }
        /* 选择偶数个 */
        .ul2 li:nth-child(even){
            color: purple;
        }
        /*选择 3 的倍数 */
        .ul2 li:nth-child(3n){
            color: blue;
        }
        /* 选择 3 以后的元素 */
        .ul2 li:nth-child(n+3){
            color: orange;
        }
        /* 选择第三个之前的元素 */
        .ul2 li:nth-child(-n+3){
            color: brown;
        }
    </style>
</head>
<body>
    <ul class="ul1">
        <li>第一个 li</li>
        <li>第二个 li</li>
        <li>第三个 li</li>
        <li>第四个 li</li>
        <li>第五个 li</li>
        <li>第六个 li</li>
        <li>第七个 li</li>
        <li>第八个 li</li>
        <li>第九个 li</li>
        <li>第十个 li</li>
    </ul>
    <ul class="ul2">
        <li>第一个 li</li>
        <li>第二个 li</li>
        <li>第三个 li</li>
        <li>第四个 li</li>
        <li>第五个 li</li>
        <li>第六个 li</li>
        <li>第七个 li</li>
        <li>第八个 li</li>
        <li>第九个 li</li>
        <li>第十个 li</li>
    </ul>
</body>
</html>
