<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面基本布局</title>
    <style>
        .header {
            height: 80px;
            background: black;
        }
        .nav {
            width: 1000px;
            height: 60px;
            background: skyblue;
        }
        .main {
            height: 1000px;
            width: 1000px;
            background: pink;
        }
        .footer {
            height: 100px;
            background: purple;
        }
        /* 让块级盒子在浏览器中居中水平对齐 */
        .center {
            margin: 0 auto;
        }
        * {
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>
    <!-- 头部内容 -->
     <div class="header"></div>
    <!-- 导航栏  -->
     <div class="nav center" ></div>
     <!-- 主体部分 -->
    <div class="main center"></div>
    <!-- 底部 -->
    <div class="footer"></div>
</body>
</html>
